      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        address: { type: string, maxLength: 500 }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        status:
          type: string
          enum: [provisioning, active, offline, retired]
        created_at: { type: string, format: date-time }
    CameraListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/Camera" }
        meta:
          type: object
          additionalProperties: false
          required: [count, next]
          properties:
            count: { type: integer, minimum: 0, maximum: 500 }
            next: { type: [string, "null"] }
    CameraEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Camera" }
    CreateCameraRequest:
      type: object
      additionalProperties: false
      required: [site_id, serial_number, name]
      properties:
        site_id: { type: string, format: uuid }
        serial_number: { type: string, minLength: 1, maxLength: 128 }
        name: { type: string, minLength: 1, maxLength: 120 }
        group_name: { type: string, maxLength: 120 }
        tags:
          type: array
          maxItems: 32
          items: { type: string, minLength: 1, maxLength: 64 }
    UpdateCameraRequest:
      type: object
      additionalProperties: false
      required: [config_version]
      anyOf:
        - required: [name]
        - required: [group_name]
        - required: [tags]
        - required: [lifecycle_status]
      properties:
        config_version: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 120 }
        group_name: { type: string, maxLength: 120 }
        tags:
          type: array
          maxItems: 32
          items: { type: string, minLength: 1, maxLength: 64 }
        lifecycle_status:
          type: string
          description: Retirement is available only through DELETE /cameras/{id}.
          enum: [pending, active, offline]
    Camera:
      type: object
      additionalProperties: false
      description: Metadata-only camera record; credentials and stream URLs are intentionally excluded.
      required: [id, tenant_id, site_id, serial_number, name, tags, lifecycle_status, config_version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        serial_number: { type: string, minLength: 1, maxLength: 128 }
        name: { type: string, minLength: 1, maxLength: 120 }
        group_name: { type: string, maxLength: 120 }
        tags:
          type: array
          maxItems: 32
          items: { type: string, minLength: 1, maxLength: 64 }
        lifecycle_status:
          type: string
          enum: [pending, active, offline, retired]
        config_version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ZoneListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/Zone" }
        meta:
          type: object
          additionalProperties: false
          required: [count, next]
          properties:
            count: { type: integer, minimum: 0, maximum: 500 }
            next: { type: [string, "null"] }
    ZoneEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Zone" }
    CreatePrivacyMaskRequest:
      type: object
      additionalProperties: false
      required: [site_id, camera_id, name, geometry]
      properties:
        site_id: { type: string, format: uuid }
        camera_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        geometry: { $ref: "#/components/schemas/GeoJSONPolygon" }
    PrivacyMaskApproval:
      type: object
      required: [approver_id, approved_at]
      properties:
        approver_id: { type: string, maxLength: 128 }
        approved_at: { type: string, format: date-time }
    PrivacyMaskRequest:
      type: object
      description: Metadata-only governance record; it is not an active or edge-delivered mask.
      required: [id, tenant_id, site_id, camera_id, name, geometry, status, requested_by, requested_at, approvals]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        camera_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        geometry: { $ref: "#/components/schemas/GeoJSONPolygon" }
        status: { type: string, enum: [pending, approved] }
        requested_by: { type: string, maxLength: 128 }
        requested_at: { type: string, format: date-time }
        approvals:
          type: array
          maxItems: 2
          items: { $ref: "#/components/schemas/PrivacyMaskApproval" }
    PrivacyMaskRequestEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/PrivacyMaskRequest" }
    GeoJSONPolygon:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type: { type: string, const: Polygon }
        coordinates:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: array
            minItems: 4
            items:
              type: array
              minItems: 2
              maxItems: 2
              items: { type: number, minimum: -1000000, maximum: 1000000 }
    GeoJSONLineString:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type: { type: string, const: LineString }
        coordinates:
          type: array
          minItems: 2
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: number, minimum: -1000000, maximum: 1000000 }
    CreateZoneRequest:
      type: object
      additionalProperties: false
      required: [site_id, name, kind, geometry]
      properties:
        site_id: { type: string, format: uuid }
        camera_id: { type: string, format: uuid }
        floor: { type: string, maxLength: 120 }
        name: { type: string, minLength: 1, maxLength: 120 }
        kind:
          type: string
          enum: [intrusion, restricted_zone, loitering, abandoned, tripwire]
          description: Mask zones are intentionally excluded pending the documented Super Admin dual-approval workflow.
        geometry:
          oneOf:
            - $ref: "#/components/schemas/GeoJSONPolygon"
            - $ref: "#/components/schemas/GeoJSONLineString"
        enabled: { type: boolean, default: true }
        loiter_seconds:
          type: integer
          minimum: 30
          maximum: 600
          description: Optional dwell duration for a loitering zone; defaults to 30 seconds and is rejected for other zone kinds.
        subject_classes:
          type: array
          maxItems: 7
          uniqueItems: true
          description: Optional bounded allowlist of locally observed subject classes. An omitted or empty list evaluates all local classes; no identity, plate, or biometric classes are accepted.
          items: { type: string, enum: [person, bicycle, bus, car, motorcycle, truck, van] }
    UpdateZoneRequest:
      type: object
      additionalProperties: false
      required: [config_version]
      anyOf:
        - required: [name]
        - required: [floor]
        - required: [geometry]
        - required: [enabled]
        - required: [loiter_seconds]
        - required: [subject_classes]
      properties:
        config_version: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 120 }
        floor: { type: string, maxLength: 120 }
        geometry:
          oneOf:
            - $ref: "#/components/schemas/GeoJSONPolygon"
            - $ref: "#/components/schemas/GeoJSONLineString"
        enabled: { type: boolean }
        loiter_seconds:
          type: integer
          minimum: 30
          maximum: 600
          description: Mutable dwell duration for a loitering zone only.
        subject_classes:
          type: array
          maxItems: 7
          uniqueItems: true
          description: Replaces the local subject-class allowlist; an empty list removes the gate.
          items: { type: string, enum: [person, bicycle, bus, car, motorcycle, truck, van] }
    Zone:
      type: object
      additionalProperties: false
      description: Versioned metadata-only rule-zone configuration. No footage, image pixels, or stream credentials are included.
      required: [id, tenant_id, site_id, name, kind, geometry, enabled, config_version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        camera_id: { type: string, format: uuid }
        floor: { type: string, maxLength: 120 }
        name: { type: string, minLength: 1, maxLength: 120 }
        kind: { type: string, enum: [intrusion, restricted_zone, loitering, abandoned, tripwire] }
        geometry:
          oneOf:
            - $ref: "#/components/schemas/GeoJSONPolygon"
            - $ref: "#/components/schemas/GeoJSONLineString"
        enabled: { type: boolean }
        loiter_seconds: { type: integer, minimum: 30, maximum: 600 }
        subject_classes:
          type: array
          maxItems: 7
          uniqueItems: true
          items: { type: string, enum: [person, bicycle, bus, car, motorcycle, truck, van] }
        config_version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    IssueDeviceClaimRequest:
      type: object
