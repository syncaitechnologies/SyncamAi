      properties:
        heartbeat_id: { type: string, format: uuid }
        reported_at: { type: string, format: date-time }
        uptime_seconds: { type: integer, minimum: 0, maximum: 3155760000 }
        store_forward_depth: { type: integer, minimum: 0, maximum: 1000000000 }
        firmware_version: { type: string, minLength: 1, maxLength: 128 }
        health: { $ref: "#/components/schemas/DeviceHealth" }
    DeviceHealth:
      type: object
      additionalProperties: false
      required: [cpu_utilization_percent, gpu_utilization_percent, temperature_celsius, inference_latency_ms, thermal_state]
      properties:
        cpu_utilization_percent: { type: number, minimum: 0, maximum: 100 }
        gpu_utilization_percent: { type: number, minimum: 0, maximum: 100 }
        temperature_celsius: { type: number, minimum: -40, maximum: 150 }
        inference_latency_ms: { type: number, minimum: 0, maximum: 600000 }
        thermal_state: { type: string, enum: [normal, warning, critical] }
    DeviceHeartbeatEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [device, observed_at]
          properties:
            device: { $ref: "#/components/schemas/EdgeDevice" }
            observed_at: { type: string, format: date-time }
    EdgeDevice:
      type: object
      additionalProperties: false
      description: Tenant/site binding metadata only; private keys and certificate material are never returned.
      required: [id, tenant_id, site_id, serial_number, hardware_tier, status, certificate_status, store_forward_depth, uptime_seconds, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        serial_number: { type: string, minLength: 1, maxLength: 128 }
        hardware_tier: { type: string, enum: [s, m, l] }
        model: { type: string, maxLength: 120 }
        status: { type: string, enum: [pending, active, offline, retired] }
        certificate_status: { type: string, enum: [pending, active, revoked, rotating] }
        firmware_version: { type: string, maxLength: 128 }
        store_forward_depth: { type: integer, minimum: 0, maximum: 1000000000 }
        uptime_seconds: { type: integer, minimum: 0, maximum: 3155760000 }
        desired_config_revision: { type: integer, minimum: 0, description: Authenticated heartbeat push hint; the edge still pulls the immutable revision over mTLS. }
        health: { $ref: "#/components/schemas/DeviceHealth" }
        last_heartbeat: { type: string, format: date-time }
        activated_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ConfigurationRevisionEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/ConfigurationRevision" }
    ConfigurationRevisionListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/ConfigurationRevision" }
        meta:
          type: object
          additionalProperties: false
          required: [count, next]
          properties:
            count: { type: integer, minimum: 0, maximum: 500 }
            next: { type: [string, "null"] }
    ConfigurationRevision:
      type: object
      additionalProperties: false
      description: Immutable metadata-only site configuration snapshot. Privacy mask zones remain excluded pending their security-reviewed dual-approval workflow.
      required: [id, tenant_id, site_id, number, payload, content_hash, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        number: { type: integer, minimum: 1 }
        payload: { type: object, additionalProperties: true }
        content_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        created_by: { type: string, minLength: 1, maxLength: 128 }
        created_at: { type: string, format: date-time }
    DeviceConfigurationStatusRequest:
      type: object
      additionalProperties: false
      required: [revision, state]
      properties:
        revision: { type: integer, minimum: 1 }
        state: { type: string, enum: [applied, failed] }
        error_message: { type: string, minLength: 1, maxLength: 512 }
    DeviceConfigurationStatusEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/DeviceConfigurationStatus" }
    DeviceConfigurationStatus:
      type: object
      additionalProperties: false
      required: [device_id, tenant_id, site_id, revision, state, reported_at]
      properties:
        device_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        revision: { type: integer, minimum: 1 }
        state: { type: string, enum: [applied, failed] }
        error_message: { type: string, maxLength: 512 }
        reported_at: { type: string, format: date-time }
        applied_at: { type: string, format: date-time }
