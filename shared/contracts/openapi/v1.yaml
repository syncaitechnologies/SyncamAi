          properties:
            claim: { $ref: "#/components/schemas/DeviceClaim" }
            claim_token:
              type: string
              minLength: 80
              maxLength: 256
              readOnly: true
              description: Returned only to the enrolling administrator; never persisted in plaintext.
    DeviceClaim:
      type: object
      additionalProperties: false
      required: [id, device_id, tenant_id, site_id, serial_number, hardware_tier, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        serial_number: { type: string, minLength: 1, maxLength: 128 }
        hardware_tier: { type: string, enum: [s, m, l] }
        model: { type: string, maxLength: 120 }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    EdgeDeviceEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/EdgeDevice" }
    EdgeDeviceListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/EdgeDevice" }
