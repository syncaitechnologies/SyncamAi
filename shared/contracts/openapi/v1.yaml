        data:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/Alert" }
        meta:
          type: object
          additionalProperties: false
          required: [count, next]
          properties:
            count: { type: integer, minimum: 0, maximum: 100 }
            next: { type: [string, "null"] }
    AlertEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Alert" }
    Alert:
      type: object
      additionalProperties: false
      required: [id, tenant_id, event_id, site_id, camera_id, zone_id, event_type, severity, status, confidence, occurred_at, created_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        camera_id: { type: string, format: uuid }
        zone_id: { type: string, format: uuid }
        event_type: { type: string }
        severity:
          type: string
          enum: [critical, high, medium, low, info]
        status:
          type: string
          enum: [unacknowledged, acknowledged, dispatched, arrived, resolved, dismissed, snoozed]
        confidence: { type: number, minimum: 0, maximum: 1 }
        occurred_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        acked_at: { type: string, format: date-time }
        acked_by: { type: string, minLength: 1, maxLength: 128 }
    WebSocketTicketRequest:
      type: object
      additionalProperties: false
      required: [site_id]
      properties:
        site_id: { type: string, format: uuid }
    WebSocketTicketEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [ticket, expires_at, protocol]
          properties:
            ticket: { type: string, minLength: 43, maxLength: 43 }
            expires_at: { type: string, format: date-time }
            protocol: { type: string, const: syncam.realtime.v1 }
    CurrentUserEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/CurrentUser"
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, tenant_id, site_ids, roles, scopes, data_class, mfa_level]
      properties:
        id: { type: string, minLength: 1 }
        email: { type: string, format: email }
        tenant_id: { type: string, minLength: 1, maxLength: 128 }
        site_ids:
          type: array
          items: { type: string, minLength: 1, maxLength: 128 }
        roles:
          type: array
          minItems: 1
          items:
            type: string
            enum: [super_admin, site_admin, operator, auditor, viewer]
        scopes:
          type: array
          items: { type: string, minLength: 1 }
        data_class:
          type: array
          items:
            type: string
            enum: [metadata, raw_video, biometric]
        mfa_level: { type: string, minLength: 1 }
    SiteListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Site" }
        meta:
          type: object
          additionalProperties: false
          required: [count, next]
          properties:
            count: { type: integer, minimum: 0 }
            next: { type: [string, "null"] }
    SiteEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Site" }
    CreateSiteRequest:
      type: object
