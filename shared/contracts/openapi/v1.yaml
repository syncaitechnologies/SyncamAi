      properties:
        site_id: { type: string, format: uuid }
        serial_number: { type: string, minLength: 1, maxLength: 128 }
        hardware_tier:
          type: string
          enum: [s, m, l]
        model: { type: string, maxLength: 120 }
    ActivateDeviceRequest:
      type: object
      additionalProperties: false
      required: [claim_token, serial_number]
      properties:
        claim_token:
          type: string
          minLength: 80
          maxLength: 256
