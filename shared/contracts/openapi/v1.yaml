openapi: 3.1.0
info:
  title: SentinelVision API
  version: 0.1.0
  description: SyncCam AI external API retaining canonical wire identifiers pending a migration ADR.
servers:
  - url: https://api.sentinelvision.ai/v1
paths:
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Return the verified tenant-scoped user context
      security:
        - oidc: [auth:read]
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      responses:
        "200":
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserEnvelope"
        "401": { description: Authentication required }
        "403": { description: Capability denied }
        "404": { description: Tenant scope not found }
  /auth/ws-ticket:
    post:
      operationId: issueAlertWebSocketTicket
      summary: Issue a 30-second single-use ticket for one authorized site stream
      security:
        - oidc: [alerts:read]
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebSocketTicketRequest" }
      responses:
        "201":
          description: Single-use ticket returned with no-store caching
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebSocketTicketEnvelope" }
        "401": { description: Authentication required }
        "403": { description: Site or capability denied }
        "404": { description: Tenant scope not found }
        "422": { description: Ticket request validation failed }
        "503": { description: Realtime gateway unavailable }
  /sites:
    get:
      operationId: listSites
      summary: List sites visible inside the verified tenant and site scope
      security:
        - oidc: [sites:read]
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      responses:
        "200":
          description: Tenant- and site-scoped list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteListEnvelope"
        "401": { description: Authentication required }
        "403": { description: Capability denied }
        "404": { description: Tenant scope not found }
    post:
      operationId: createSite
      summary: Create one tenant site with an idempotent, audited mutation
      security:
        - oidc: [tenant:manage]
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSiteRequest"
      responses:
        "201":
          description: Site created or exact stored response replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteEnvelope"
        "401": { description: Authentication required }
        "403": { description: Capability denied }
        "404": { description: Tenant scope not found }
        "409": { description: Resource conflict or idempotency key reused with a different body }
        "422": { description: Request validation failed }
  /cameras:
    get:
      operationId: listCameras
      summary: List metadata-only cameras visible inside the verified tenant and site scope
      security:
        - oidc: [config:read]
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: site_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Active tenant- and site-scoped camera metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraListEnvelope" }
        "401": { description: Authentication required }
        "403": { description: Capability denied }
        "404": { description: Tenant or site scope not found }
        "422": { description: Filter validation failed }
        "503": { description: Camera repository unavailable }
    post:
      operationId: createCamera
      summary: Register one tenant camera with an idempotent, audited mutation
      security:
        - oidc: [config:write]
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCameraRequest" }
      responses:
        "201":
          description: Camera registered or exact stored response replayed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraEnvelope" }
        "401": { description: Authentication required }
        "403": { description: Capability or site scope denied }
        "404": { description: Tenant or site scope not found }
        "409": { description: Serial conflict or idempotency key reused with a different body }
        "422": { description: Request validation failed }
        "503": { description: Camera repository unavailable }
  /cameras/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/TenantHeader"
    get:
      operationId: getCamera
      summary: Return one authorized camera metadata record
      security:
        - oidc: [config:read]
      responses:
        "200":
          description: Camera metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraEnvelope" }
        "401": { description: Authentication required }
        "403": { description: Capability denied }
        "404": { description: Camera or tenant scope not found }
        "503": { description: Camera repository unavailable }
    patch:
      operationId: updateCamera
      summary: Update mutable camera metadata using optimistic concurrency and an atomic audit record
      security:
        - oidc: [config:write]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCameraRequest" }
      responses:
        "200":
          description: Updated camera metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraEnvelope" }
        "401": { description: Authentication required }
        "403": { description: Capability or site scope denied }
        "404": { description: Camera or tenant scope not found }
        "409": { description: Configuration version or lifecycle transition conflict }
        "422": { description: Request validation failed }
        "503": { description: Camera repository unavailable }
    delete:
      operationId: retireCamera
      summary: Soft-retire one camera while preserving evidence references and audit history
      security:
        - oidc: [config:write]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Retired camera metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraEnvelope" }
        "401": { description: Authentication required }
        "403": { description: Capability or site scope denied }
        "404": { description: Camera or tenant scope not found }
        "422": { description: Correlation header validation failed }
        "503": { description: Camera repository unavailable }
  /zones:
    get:
      operationId: listZones
      summary: List versioned rule zones visible inside verified tenant and site scope
      security:
        - oidc: [config:read]
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: site_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Authorized zone records and GeoJSON geometry only; footage is never included
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneListEnvelope" }
        "401": { description: Authentication required }
        "403": { description: Capability denied }
        "404": { description: Tenant or site scope not found }
        "422": { description: Filter validation failed }
        "503": { description: Zone repository unavailable }
    post:
      operationId: createZone
      summary: Create one tenant-scoped rule zone with an idempotent audited mutation
      security:
        - oidc: [config:write]
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateZoneRequest" }
      responses:
        "201":
          description: Zone created or exact stored response replayed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneEnvelope" }
        "401": { description: Authentication required }
        "403": { description: Capability or site scope denied }
        "404": { description: Tenant or site scope not found }
        "409": { description: Idempotency key reused with a different body }
        "422": { description: Zone or GeoJSON validation failed }
        "503": { description: Zone repository unavailable }
  /zones/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/TenantHeader"
    get:
      operationId: getZone
      summary: Return one authorized versioned zone
      security:
        - oidc: [config:read]
      responses:
        "200":
          description: Zone configuration metadata and geometry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneEnvelope" }
        "401": { description: Authentication required }
        "403": { description: Capability denied }
        "404": { description: Zone or tenant scope not found }
        "503": { description: Zone repository unavailable }
    patch:
      operationId: updateZone
      summary: Update mutable zone fields using optimistic configuration versions and an atomic audit record
      security:
        - oidc: [config:write]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateZoneRequest" }
      responses:
        "200":
          description: Updated zone configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneEnvelope" }
        "401": { description: Authentication required }
        "403": { description: Capability or site scope denied }
        "404": { description: Zone or tenant scope not found }
        "409": { description: Configuration version conflict }
        "422": { description: Zone or GeoJSON validation failed }
        "503": { description: Zone repository unavailable }
  /zones/{id}/push:
    post:
      operationId: publishZoneConfiguration
      summary: Publish an immutable site configuration revision for edge pull delivery
      security:
        - oidc: [config:write]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "201":
          description: Immutable site revision published; active edge devices receive a heartbeat revision hint and pull the snapshot over mTLS.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigurationRevisionEnvelope" }
        "401": { description: Authentication required }
        "403": { description: Capability or site scope denied }
        "404": { description: Zone or tenant scope not found }
        "422": { description: Correlation header validation failed }
        "503": { description: Configuration delivery unavailable }
  /config/versions:
    get:
      operationId: listConfigurationRevisions
      summary: List immutable site configuration revision history without credentials or footage
      security:
        - oidc: [config:read]
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: site_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Authorized configuration revision history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigurationRevisionListEnvelope" }
        "401": { description: Authentication required }
        "403": { description: Capability denied }
        "404": { description: Tenant or site scope not found }
        "422": { description: Filter validation failed }
        "503": { description: Configuration delivery unavailable }
  /privacy-mask-requests:
    post:
      operationId: createPrivacyMaskRequest
      summary: Create metadata-only privacy-mask request for the separate dual-approval workflow
      security:
        - oidc: [privacy_masks:approve]
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePrivacyMaskRequest" }
      responses:
        "201": { description: Pending request created; no mask is activated, content: { application/json: { schema: { $ref: "#/components/schemas/PrivacyMaskRequestEnvelope" } } } }
        "401": { description: Authentication required }
        "403": { description: MFA-authenticated Super Admin capability required }
        "422": { description: Request validation failed }
  /privacy-mask-requests/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/TenantHeader"
    get:
      operationId: getPrivacyMaskRequest
      summary: Read one tenant-scoped metadata-only privacy-mask request
      security:
        - oidc: [privacy_masks:approve]
      responses:
        "200": { description: Approval state only, content: { application/json: { schema: { $ref: "#/components/schemas/PrivacyMaskRequestEnvelope" } } } }
        "401": { description: Authentication required }
        "403": { description: MFA-authenticated Super Admin capability required }
        "404": { description: Request not found }
  /privacy-mask-requests/{id}/approvals:
    post:
      operationId: approvePrivacyMaskRequest
      summary: Record one distinct Super Admin approval; approval does not activate a mask
      security:
        - oidc: [privacy_masks:approve]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200": { description: Updated approval metadata, content: { application/json: { schema: { $ref: "#/components/schemas/PrivacyMaskRequestEnvelope" } } } }
        "401": { description: Authentication required }
        "403": { description: MFA-authenticated Super Admin capability required }
        "404": { description: Request not found }
        "409": { description: Requester, duplicate-final, or surplus approval conflict }
  /device-claims:
    post:
      operationId: issueDeviceClaim
      summary: Issue a 24-hour single-use edge-device claim without persisting its bearer token
      security:
        - oidc: [config:write]
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueDeviceClaimRequest" }
      responses:
        "201":
          description: Claim issued once or deterministically reconstructed for an exact idempotent replay; response must not be cached
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceClaimEnvelope" }
        "401": { description: Authentication required }
        "403": { description: Capability or site scope denied }
        "404": { description: Tenant or site scope not found }
        "409": { description: Serial conflict or idempotency key reused with a different body }
        "422": { description: Request validation failed }
        "503": { description: Device enrollment repository unavailable }
  /edge/devices:
    get:
      operationId: listEdgeDevices
      summary: List the authorized tenant fleet with status derived using the canonical 90-second staleness threshold
      security:
        - oidc: [config:read]
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: site_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Tenant- and site-scoped fleet status observed at one server timestamp
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EdgeDeviceListEnvelope" }
        "401": { description: Authentication required }
        "403": { description: Capability denied }
        "404": { description: Tenant or site scope not found }
        "422": { description: Filter validation failed }
        "503": { description: Device status repository unavailable }
  /edge/devices/{id}/pair:
    post:
      operationId: activateDevice
      summary: Atomically consume a one-time claim and bind an edge device to its signed tenant and site
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivateDeviceRequest" }
      responses:
        "200":
          description: Device activated; certificate enrollment remains pending until the tenant CA integration completes
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EdgeDeviceEnvelope" }
        "401": { description: Claim is invalid, expired, already consumed, or does not match the device serial }
        "422": { description: Request validation failed }
        "503": { description: Device enrollment repository unavailable }
  /edge/devices/{id}/heartbeat:
    post:
      operationId: recordDeviceHeartbeat
      summary: Idempotently record liveness and bounded operational telemetry for the certificate-bound device
      security:
        - deviceMutualTLS: []
      parameters:
        - name: id
          in: path
          required: true
          description: Must match the UUID in the verified client certificate common name.
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceHeartbeatRequest" }
      responses:
        "200":
          description: Heartbeat accepted or replayed without advancing liveness twice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceHeartbeatEnvelope" }
        "401": { description: Verified active device certificate required }
        "409": { description: Heartbeat identifier reused with different telemetry }
        "422": { description: Request validation failed }
        "503": { description: Device heartbeat service unavailable }
  /edge/devices/{id}/config:
    get:
      operationId: pullDeviceConfiguration
      summary: Return the newest immutable site configuration revision after the supplied edge revision
      security:
        - deviceMutualTLS: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: after_revision
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Newer revision is available
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigurationRevisionEnvelope" }
        "204": { description: The edge already has the latest revision }
        "401": { description: Verified active device certificate required }
        "422": { description: Revision validation failed }
        "503": { description: Configuration delivery unavailable }
  /edge/devices/{id}/config/status:
    post:
      operationId: reportDeviceConfiguration
      summary: Record the edge's applied or failed outcome for one immutable revision
      security:
        - deviceMutualTLS: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceConfigurationStatusRequest" }
      responses:
        "200":
          description: Edge application outcome recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceConfigurationStatusEnvelope" }
        "401": { description: Verified active device certificate required }
        "422": { description: Status or revision validation failed }
        "503": { description: Configuration delivery unavailable }
  /events:
    post:
      operationId: ingestEvent
      summary: Ingest a tenant-scoped, human-review event
      security:
        - oidc: [events:write]
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/EventRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetectionEvent"
      responses:
        "202":
          description: Event accepted, or the same logical event replayed without another outbox message
          headers:
            Idempotent-Replayed:
              description: Present and true when an existing identical event is replayed.
              schema: { type: string, const: "true" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestEventEnvelope"
        "401":
          description: Authentication required
        "403":
          description: Tenant or capability denied
        "404":
          description: Tenant or site scope not found
        "409":
          description: Event identifier or dedupe key conflicts with different content
        "422":
          description: Event validation failed
        "503":
          description: Event persistence unavailable
  /alerts:
    get:
      operationId: listAlerts
      summary: List the tenant- and site-scoped operator alert queue
      security:
        - oidc: [alerts:read]
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      responses:
        "200":
          description: Up to 100 alerts sorted by priority and age
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertListEnvelope"
        "401": { description: Authentication required }
        "403": { description: Capability denied }
        "404": { description: Tenant scope not found }
        "422": { description: Tenant header validation failed }
        "503": { description: Alert projection unavailable }
  /alerts/{id}/acknowledge:
    post:
      operationId: acknowledgeAlert
      summary: Idempotently lock an unacknowledged alert into the operator queue
      security:
        - oidc: [alerts:write]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Alert acknowledged or exact stored response replayed
          headers:
            Idempotent-Replayed:
              description: Present and true for an exact replay.
              schema: { type: string, const: "true" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertEnvelope" }
        "401": { description: Authentication required }
        "403": { description: Operator capability or site scope denied }
        "404": { description: Tenant or alert not found }
        "409": { description: Alert state conflict or idempotency key conflict }
        "422": { description: Mutation headers are invalid }
        "503": { description: Alert workflow unavailable }
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://auth.sentinelvision.ai/.well-known/openid-configuration
    deviceMutualTLS:
      type: mutualTLS
      description: TLS-verified edge client certificate with CN equal to the registered device UUID.
  parameters:
    TenantHeader:
      name: X-SentinelVision-Tenant-ID
      in: header
      required: true
      description: Must exactly match the tenant_id claim in the verified bearer token.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Tenant-scoped mutation key retained for at least 24 hours.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Client UUIDv4 or a server-generated UUIDv4 returned in the response.
      schema:
        type: string
        format: uuid
    EventRequestId:
      name: X-SentinelVision-Request-ID
      in: header
      required: true
      description: UUIDv4 used to correlate the accepted event and append-only audit record.
      schema:
        type: string
        format: uuid
  schemas:
    DetectionEvent:
      type: object
      additionalProperties: false
      required:
        - event_id
        - tenant_id
        - dedupe_key
        - occurred_at
        - site_id
        - camera_id
        - zone_id
        - event_type
        - model_version
        - confidence
        - evidence_refs
        - requires_human_review
        - review_state
      properties:
        event_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        dedupe_key: { type: string, minLength: 1, maxLength: 256 }
        occurred_at: { type: string, format: date-time }
        site_id: { type: string, format: uuid }
        camera_id: { type: string, format: uuid }
        zone_id: { type: string, format: uuid }
        event_type:
          type: string
          enum: [camera_health, intrusion, restricted_zone, loitering, vehicle_activity, weapon_review, fire_review, smoke_review, attendance_review, ppe_review, fall_review, fight_review, abandoned_object_review]
        model_version: { type: string, minLength: 1 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        evidence_refs:
          type: array
          items: { type: string }
        requires_human_review:
          type: boolean
          const: true
        review_state:
          type: string
          enum: [pending, acknowledged, confirmed, dismissed]
        observed_behavior:
          type: string
          enum: [detected]
          description: Required for vehicle_activity; describes only the directly observed behavior and never a theft or risk conclusion.
        subject_class:
          type: string
          enum: [bicycle, bus, car, motorcycle, truck, van]
          description: Required for vehicle_activity; a shared-detector class, not plate, ReID, speed, or identity enrichment.
    IngestEventEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [event_id, accepted]
          properties:
            event_id: { type: string, format: uuid }
            accepted: { type: boolean, const: true }
    AlertListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
