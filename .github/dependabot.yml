version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # react and react-dom must always be the exact same version.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /edge
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /ai-services
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /infrastructure/terraform/sandbox
    schedule:
      interval: weekly
