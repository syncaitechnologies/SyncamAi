name: syncam-ai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: syncam
      POSTGRES_USER: syncam_admin
      POSTGRES_PASSWORD: ${SYNCAM_POSTGRES_ADMIN_PASSWORD:?set SYNCAM_POSTGRES_ADMIN_PASSWORD in the local environment}
      SYNCAM_POSTGRES_APP_PASSWORD: ${SYNCAM_POSTGRES_APP_PASSWORD:?set SYNCAM_POSTGRES_APP_PASSWORD in the local environment}
    ports:
      - "5432:5432"
    volumes:
      - syncam-postgres:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncam_admin -d syncam"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: syncam
      RABBITMQ_DEFAULT_PASS: ${SYNCAM_RABBITMQ_PASSWORD:?set SYNCAM_RABBITMQ_PASSWORD in the local environment}
    ports:
      - "5672:5672"
      - "15672:15672"

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: kinesis,s3,sns,sqs,secretsmanager,kms
    ports:
      - "4566:4566"

volumes:
  syncam-postgres:
