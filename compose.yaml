name: syncam-ai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: syncam
      POSTGRES_USER: syncam
      POSTGRES_PASSWORD: ${SYNCAM_POSTGRES_PASSWORD:?set SYNCAM_POSTGRES_PASSWORD in the local environment}
    ports:
      - "5432:5432"
    volumes:
      - syncam-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncam -d syncam"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: syncam
      RABBITMQ_DEFAULT_PASS: ${SYNCAM_RABBITMQ_PASSWORD:?set SYNCAM_RABBITMQ_PASSWORD in the local environment}
    ports:
      - "5672:5672"
      - "15672:15672"

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: kinesis,s3,sns,sqs,secretsmanager,kms
    ports:
      - "4566:4566"

volumes:
  syncam-postgres:
