[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "syncam-ai-services"
version = "0.0.0"
description = "SyncCam AI Python 3.12 service scaffolds"
requires-python = ">=3.12,<3.13"
license = "LicenseRef-Proprietary"

[project.optional-dependencies]
person-detector = [
  "numpy==2.3.5",
  "openvino==2026.4.1",
]
site-worker = [
  # numpy, openvino, opencv and cryptography are pinned to the versions
  # tested live on a box; bump each in its own PR.
  "numpy==2.3.5",
  "openvino==2026.4.1",
  "opencv-python-headless==5.1.0.95",
  "tzdata>=2024.1",
  "cryptography==50.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

