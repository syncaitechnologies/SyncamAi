[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "syncam-ai-services"
version = "0.0.0"
description = "SyncCam AI Python 3.12 service scaffolds"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
